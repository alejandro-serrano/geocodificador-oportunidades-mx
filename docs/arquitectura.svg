n conﬁgurar nada.</text><g transform="matrix(62.5,0,0,62.5,1278.605143,2095.833333)"></g><g transform="matrix(62.5,0,0,62.5,1295.969645,2095.833333)"></g><text x="41.667px" y="2095.833px" style="font-family:'Helvetica';font-size:62.5px;fill:#68758d;">Si la <tspan x="177.195px 218.882px " y="2095.833px 2095.833px ">AP</tspan>I de inferencia está caída, la geocodiﬁcación sigue funcionando: solo se deshabilita el análisis de potencial.</text><path d="M1395.833,350l0,-175l1054.167,0" style="fill:none;fill-rule:nonzero;stroke:#4777b4;stroke-width:9.34px;"/><defs><linearGradient id="_Linear1" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse" gradientTransform="matrix(0,900,-900,0,866.666667,358.333333)"><stop offset="0" style="stop-color:#f3f8fd;stop-opacity:1"/><stop offset="1" style="stop-color:#e6effa;stop-opacity:1"/></linearGradient><linearGradient id="_Linear3" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse" gradientTransform="matrix(0,900,-900,0,866.666667,358.333333)"><stop offset="0" style="stop-color:#4777b4;stop-opacity:1"/><stop offset="1" style="stop-color:#0d7f91;stop-opacity:1"/></linearGradient></defs></svg>